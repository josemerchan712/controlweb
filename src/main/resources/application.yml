spring:
  application:
    name: controlweb
  # Local convenience: load variables from a git-ignored .env file if present.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/controlweb}
    username: ${DB_USERNAME:controlweb}
    password: ${DB_PASSWORD:}
  task:
    scheduling:
      shutdown:
        # Let a running cycle finish (CheckRunner waits for its checks) before the scheduler stops.
        await-termination: true
        await-termination-period: 15s
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Flyway; Hibernate only validates the mapping.
      ddl-auto: validate

app:
  # Security settings come ONLY from the environment. There are deliberately no defaults:
  # the application refuses to start if the secret or the admin password are missing or weak.
  jwt:
    secret: ${JWT_SECRET:}
    ttl-minutes: ${JWT_TTL_MINUTES:60}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  cors:
    # Comma separated exact origins, no wildcards. Empty = no cross-origin access.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  checker:
    # SSRF guard. Keep false everywhere except local development and tests (see application-dev.yml).
    allow-private-hosts: false
    connect-timeout: 5s   # TCP connection + TLS handshake
    request-timeout: 10s  # status + headers of one request (every redirect hop is another request)
    max-redirects: 5
    user-agent: ControlWeb/1.0
  scheduler:
    enabled: true          # periodic cycle; manual checks work either way
    initial-delay: 5s
    fixed-delay: 10s       # pause between the END of a cycle and the start of the next
    max-concurrency: 10    # checks running at the same time
    shutdown-timeout: 10s  # wait for running checks when the application stops
  rules:
    # HIGH_LATENCY opens only when this many CONSECUTIVE successful checks all exceed the threshold
    # (so a single spike never opens an incident).
    latency-samples: 3
  telegram:
    # BOTH are required to send to Telegram; with only one (or none) alerts are just logged.
    # The token is a secret: only from the environment, never logged.
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
    api-base-url: https://api.telegram.org
    connect-timeout: 3s
    read-timeout: 5s
    max-retries: 2          # after the first attempt: network errors, 5xx, and a short 429
    retry-delay: 500ms
    max-retry-after: 10s    # a 429 asking to wait longer than this is dropped, not retried
  alerts:
    queue-capacity: 100     # alerts waiting to be sent; beyond that they are dropped, never blocking a check
    shutdown-timeout: 10s   # let queued alerts go out when the application stops
    test-interval: 10s      # minimum time between two POST /api/alerts/test
  # Thresholds of the alert rules created for every new site.
  alert-defaults:
    down-consecutive-failures: 2
    high-latency-ms: 2000
    ssl-expiry-days: 14

# API documentation is off everywhere except the dev profile.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health
      discovery:
        # No /actuator index page: /actuator/health is the only actuator URL.
        enabled: false
  endpoint:
    health:
      # Public health check: status only, never component details.
      show-details: never
      show-components: never
