spring:
  application:
    name: controlweb
  # Local convenience: load variables from a git-ignored .env file if present.
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/controlweb}
    username: ${DB_USERNAME:controlweb}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Flyway; Hibernate only validates the mapping.
      ddl-auto: validate

app:
  checker:
    # SSRF guard. Keep false everywhere except local development and tests (see application-dev.yml).
    allow-private-hosts: false
  # Thresholds of the alert rules created for every new site.
  alert-defaults:
    down-consecutive-failures: 2
    high-latency-ms: 2000
    ssl-expiry-days: 14

management:
  endpoints:
    web:
      exposure:
        include: health
