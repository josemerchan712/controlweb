name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The workflow only reads the repository. No secrets or private variables are used anywhere in it:
# the tests generate their own random credentials and talk to a throwaway PostgreSQL container.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: mvnw verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to a full commit SHA (the tag is in the comment); Dependabot keeps them current.
      - name: Check out the code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Set up Java 21 (Temurin) with the Maven cache
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The integration tests start PostgreSQL with Testcontainers, which needs a Docker daemon.
      # GitHub's ubuntu runners include one; fail early and clearly if that ever changes.
      - name: Check that Docker is available for Testcontainers
        run: docker info --format 'Docker {{.ServerVersion}} on {{.OperatingSystem}}'

      - name: Build and test (unit + integration)
        run: ./mvnw --batch-mode --no-transfer-progress verify

      # The tests that drive the real shell scripts skip themselves when bash, PowerShell or POSIX permissions are missing (as on a
      # Windows laptop). On this Linux runner every one of them must RUN: a silently skipped test proves nothing, so the surefire
      # report of each is checked for "some tests, none failed, none skipped".
      - name: Check that the script tests really ran here (none skipped)
        run: |
          for test in InstallScriptTest InstallReaderScriptTest InstallFirewallScriptTest ServeBackupScriptTest FirewallScriptTest CaddyInstallScriptTest BackupScriptsTest DeployScriptTest VerifyScriptsTest; do
            report="target/surefire-reports/TEST-dev.josemariamerchan.controlweb.deploy.$test.xml"
            if ! grep -Eq 'tests="[1-9][0-9]*" errors="0" skipped="0" failures="0"' "$report"; then
              echo "$test did not run completely on this runner:"
              grep -o '<testsuite[^>]*>' "$report" | head -c 600
              exit 1
            fi
            echo "ok: $test ran with no skipped test"
          done

      - name: Keep the test reports when something fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # EVERY tracked *.sh file (scripts that run as root on the VPS, the deploy scripts and the test stand-ins), at ShellCheck's default
      # severity (style notes included). The image is pinned by digest (the index of koalaman/shellcheck:stable, ShellCheck 0.11.0, on
      # 2026-10-09) so the same warnings appear here and on the laptop; update the digest on purpose, not by surprise. There is no
      # .shellcheckrc, no --exclude and no "|| true": a warning is either fixed or silenced IN the script with `# shellcheck disable=SCxxxx # reason`.
      - name: ShellCheck all shell scripts
        run: |
          git ls-files -z '*.sh' | xargs -0 docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck@sha256:bb596a0d169b85ddd81d8b6d3a2ff6d5baf5fca10b97f575ebc647c3dff62b3d \
            --source-path=SCRIPTDIR --external-sources

  image:
    name: production image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Builds the image and starts it for a moment. It is NEVER published, and it needs no secret: every credential below is
    # generated randomly inside this job and thrown away with the runner.
    steps:
      - name: Check out the code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Build the image (not pushed anywhere)
        run: docker build --tag controlweb-app:ci .

      - name: Check what is inside the image
        run: deploy/verify-image.sh controlweb-app:ci

      - name: Generate throw-away credentials (never printed, never stored)
        run: |
          umask 077
          {
            echo "DB_USERNAME=controlweb"
            echo "DB_PASSWORD=$(openssl rand -hex 18)"
            echo "JWT_SECRET=$(openssl rand -base64 32)"
            echo "ADMIN_EMAIL=admin@example.com"
            echo "ADMIN_PASSWORD=$(openssl rand -hex 18)"
            echo "TRUSTED_PROXY_ADDRESSES=10.77.0.10"
            echo "PUBLIC_CORS_ALLOWED_ORIGINS=https://josemariamerchan.dev"
            echo "CONTROLWEB_TAG=ci"
          } > "$RUNNER_TEMP/env.ci"

      - name: Start the production stack with the prod profile
        run: |
          docker network create --internal --subnet 10.77.0.0/24 \
            --opt com.docker.network.bridge.name=cw-proxy controlweb_proxy
          docker compose -p controlweb-ci -f compose.prod.yml --env-file "$RUNNER_TEMP/env.ci" config --quiet
          docker compose -p controlweb-ci -f compose.prod.yml --env-file "$RUNNER_TEMP/env.ci" up -d --wait --wait-timeout 240

      - name: Verify the running container (profile, health, hardening applied by Docker)
        run: |
          container=$(docker compose -p controlweb-ci -f compose.prod.yml --env-file "$RUNNER_TEMP/env.ci" ps -q controlweb-app)
          docker logs "$container" 2>&1 | grep -F "The following 1 profile is active: \"prod\""
          deploy/verify-container.sh "$container"

      - name: Show the logs if something failed
        if: failure()
        run: docker compose -p controlweb-ci -f compose.prod.yml --env-file "$RUNNER_TEMP/env.ci" logs --no-color --tail 80

      - name: Clean up
        if: always()
        run: |
          docker compose -p controlweb-ci -f compose.prod.yml --env-file "$RUNNER_TEMP/env.ci" down --volumes --remove-orphans || true
          docker network rm controlweb_proxy || true
          rm -f "$RUNNER_TEMP/env.ci"
