version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The project is Java 21 (an LTS release; pom.xml java.version). Newer majors, such as the non-LTS 24, are a decision
      # to take by hand, never an automatic pull request. Patch and minor updates of 21 still arrive.
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # PostgreSQL majors (16 -> 18...) change the on-disk format and the data directory layout of the image: they need a
      # planned dump/restore migration, never an automatic pull request. Minor and patch releases of 16 still arrive.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
